<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minha barbearia &middot; Barbershop</title>
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/componentes.css">
    <link rel="stylesheet" href="css/paginas.css">
</head>

<body>

    <a class="pular-para-conteudo" href="#conteudo">Pular para o conteúdo</a>

    <div class="aplicacao">

        <header class="barra-lateral" id="barraLateral">
            <div class="barra-lateral__marca">
                <img class="barra-lateral__logo" src="img/logo.svg" width="40" height="40" alt="">
                <div>
                    <div class="barra-lateral__nome">Barbershop</div>
                    <div class="barra-lateral__barbearia">Barbearia do Lucas</div>
                </div>
            </div>

            <nav class="barra-lateral__nav" aria-label="Navegação principal">
                <ul>
                    <li><a class="barra-lateral__link" href="agenda.html"><svg class="barra-lateral__icone"
                                viewBox="0 0 24 24" aria-hidden="true">
                                <rect x="3" y="5" width="18" height="16" rx="2" />
                                <path d="M3 10h18M8 3v4M16 3v4" />
                            </svg>Agenda</a></li>
                    <li><a class="barra-lateral__link" href="agendamento.html"><svg class="barra-lateral__icone"
                                viewBox="0 0 24 24" aria-hidden="true">
                                <rect x="3" y="5" width="18" height="16" rx="2" />
                                <path d="M8 3v4M16 3v4M12 11v7M8.5 14.5h7" />
                            </svg>Novo agendamento</a></li>
                    <li><a class="barra-lateral__link" href="barbearia.html"><svg class="barra-lateral__icone"
                                viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M4 9h16v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9Z" />
                                <path d="M4 9 6 3h12l2 6" />
                                <path d="M10 21v-6h4v6" />
                            </svg>Minha barbearia</a></li>
                    <li><a class="barra-lateral__link" href="historico.html"><svg class="barra-lateral__icone"
                                viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="12" r="9" />
                                <path d="M12 7v5l3.5 2" />
                            </svg>Histórico</a></li>
                    <li><a class="barra-lateral__link" href="relatorios.html"><svg class="barra-lateral__icone"
                                viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M4 20h16" />
                                <rect x="6" y="11" width="3.5" height="7" />
                                <rect x="13" y="6" width="3.5" height="12" />
                            </svg>Relatórios</a></li>
                </ul>
            </nav>

            <div class="barra-lateral__rodape">
                <a class="barra-lateral__sair" href="index.html" data-sair>Sair</a>
            </div>
        </header>

        <div class="conteudo">

            <div class="topo">
                <button class="topo__menu" type="button" data-abrir-menu aria-expanded="false"
                    aria-controls="barraLateral" aria-label="Abrir menu">
                    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                        <path d="M4 7h16M4 12h16M4 17h16" />
                    </svg>
                </button>
                <h1 class="topo__titulo">Minha barbearia</h1>
                <span class="topo__data" data-data-hoje></span>
                <span class="topo__avatar" title="Lucas Rosa">LR</span>
            </div>

            <main class="pagina" id="conteudo">

                <p id="avisoBarbearia" class="aviso" role="status" aria-live="polite" hidden></p>

                <!-- PRIMEIRO ACESSO -->
                <section class="cartao" id="painelSetupInicial" aria-labelledby="tituloSetupInicial" hidden>
                    <h2 class="cartao__titulo" id="tituloSetupInicial">Primeiro acesso</h2>

                    <form id="formSetupInicial" class="formulario-barbearia" novalidate>
                        <div class="campo">
                            <label class="campo__rotulo" for="setupNome">Nome da barbearia</label>
                            <input class="campo__entrada" type="text" id="setupNome" aria-describedby="setupNome-erro">
                            <span class="campo__erro" id="setupNome-erro" aria-live="polite"></span>
                        </div>

                        <div class="linha-campos">
                            <div class="campo">
                                <label class="campo__rotulo" for="setupAbertura">Abertura</label>
                                <input class="campo__entrada" type="time" id="setupAbertura" step="300"
                                    aria-describedby="setupAbertura-erro" value="08:00">
                                <span class="campo__erro" id="setupAbertura-erro" aria-live="polite"></span>
                            </div>
                            <div class="campo">
                                <label class="campo__rotulo" for="setupFechamento">Fechamento</label>
                                <input class="campo__entrada" type="time" id="setupFechamento" step="300"
                                    aria-describedby="setupFechamento-erro" value="20:00">
                                <span class="campo__erro" id="setupFechamento-erro" aria-live="polite"></span>
                            </div>
                        </div>

                        <div class="linha-campos">
                            <div class="campo">
                                <label class="campo__rotulo" for="setupUsuario">Usuário administrador</label>
                                <input class="campo__entrada" type="text" id="setupUsuario" autocomplete="username"
                                    aria-describedby="setupUsuario-erro">
                                <span class="campo__erro" id="setupUsuario-erro" aria-live="polite"></span>
                            </div>
                            <div class="campo">
                                <label class="campo__rotulo" for="setupSenha">Senha</label>
                                <input class="campo__entrada" type="password" id="setupSenha"
                                    autocomplete="new-password" aria-describedby="setupSenha-erro">
                                <span class="campo__erro" id="setupSenha-erro" aria-live="polite"></span>
                            </div>
                        </div>

                        <div>
                            <button class="botao botao--primario" type="submit">Configurar barbearia</button>
                        </div>
                    </form>
                </section>

                <!-- ABAS -->
                <div class="abas" role="tablist" aria-label="Áreas da barbearia">
                    <button class="aba" type="button" role="tab" id="abaDados" aria-selected="false"
                        aria-controls="painelDados" data-aba="dados">Dados</button>
                    <button class="aba" type="button" role="tab" id="abaServicos" aria-selected="true"
                        aria-controls="painelServicos" data-aba="servicos">Serviços</button>
                    <button class="aba" type="button" role="tab" id="abaBarbeiros" aria-selected="false"
                        aria-controls="painelBarbeiros" data-aba="barbeiros">Barbeiros</button>
                </div>

                <!-- ABA: DADOS -->
                <section class="cartao" id="painelDados" role="tabpanel" aria-labelledby="abaDados" hidden>
                    <h2 class="cartao__titulo">Dados gerais</h2>

                    <form id="formBarbearia" class="formulario-barbearia" novalidate>
                        <div class="campo">
                            <label class="campo__rotulo" for="barbeariaNome">Nome</label>
                            <input class="campo__entrada" type="text" id="barbeariaNome"
                                aria-describedby="barbeariaNome-erro">
                            <span class="campo__erro" id="barbeariaNome-erro" aria-live="polite"></span>
                        </div>

                        <div class="campo">
                            <label class="campo__rotulo" for="barbeariaCep">CEP</label>
                            <input class="campo__entrada" type="text" id="barbeariaCep" inputmode="numeric"
                                aria-describedby="barbeariaCep-erro">
                            <span class="campo__erro" id="barbeariaCep-erro" aria-live="polite"></span>
                        </div>

                        <div class="campo">
                            <label class="campo__rotulo" for="barbeariaCultura">Cultura e valores</label>
                            <textarea class="campo__area" id="barbeariaCultura"></textarea>
                        </div>

                        <div class="linha-campos">
                            <div class="campo">
                                <label class="campo__rotulo" for="barbeariaAbertura">Abertura</label>
                                <input class="campo__entrada" type="time" id="barbeariaAbertura" step="300"
                                    aria-describedby="barbeariaAbertura-erro">
                                <span class="campo__erro" id="barbeariaAbertura-erro" aria-live="polite"></span>
                            </div>
                            <div class="campo">
                                <label class="campo__rotulo" for="barbeariaFechamento">Fechamento</label>
                                <input class="campo__entrada" type="time" id="barbeariaFechamento" step="300"
                                    aria-describedby="barbeariaFechamento-erro">
                                <span class="campo__erro" id="barbeariaFechamento-erro" aria-live="polite"></span>
                            </div>
                        </div>

                        <div>
                            <button class="botao botao--primario" type="submit">Salvar alterações</button>
                        </div>
                    </form>
                </section>

                <!-- ABA: SERVIÇOS -->
                <section id="painelServicos" role="tabpanel" aria-labelledby="abaServicos">
                    <div class="secao__cabecalho">
                        <h2>Serviços cadastrados</h2>
                        <button class="botao botao--primario" type="button" data-novo="servico">+ Novo serviço</button>
                    </div>
                    <ul class="grade-cartoes" id="gradeServicos"></ul>
                </section>

                <!-- ABA: BARBEIROS -->
                <section id="painelBarbeiros" role="tabpanel" aria-labelledby="abaBarbeiros" hidden>
                    <div class="secao__cabecalho">
                        <h2>Barbeiros cadastrados</h2>
                        <button class="botao botao--primario" type="button" data-novo="barbeiro">+ Novo
                            barbeiro</button>
                    </div>
                    <ul class="grade-cartoes" id="gradeBarbeiros"></ul>
                </section>

            </main>
        </div>
    </div>

    <!-- MODAL DE CADASTRO -->
    <div class="modal" id="modalCadastro" role="dialog" aria-modal="true" aria-labelledby="modalTitulo" hidden>
        <div class="modal__caixa">
            <div class="modal__cabecalho">
                <h2 id="modalTitulo">Novo serviço</h2>
                <button class="modal__fechar" type="button" data-fechar-modal aria-label="Fechar">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"
                        aria-hidden="true">
                        <path d="M6 6l12 12M18 6L6 18" />
                    </svg>
                </button>
            </div>

            <form id="formModal" novalidate>
                <div class="modal__corpo">
                    <div class="campo">
                        <label class="campo__rotulo" for="itemNome">Nome</label>
                        <input class="campo__entrada" type="text" id="itemNome" aria-describedby="itemNome-erro">
                        <span class="campo__erro" id="itemNome-erro" aria-live="polite"></span>
                    </div>

                    <div class="linha-campos" id="camposServico">
                        <div class="campo">
                            <label class="campo__rotulo" for="itemPreco">Preço (R$)</label>
                            <input class="campo__entrada" type="number" id="itemPreco" min="0" step="0.01"
                                inputmode="decimal" aria-describedby="itemPreco-erro">
                            <span class="campo__erro" id="itemPreco-erro" aria-live="polite"></span>
                        </div>
                        <div class="campo">
                            <label class="campo__rotulo" for="itemDuracao">Duração (min)</label>
                            <input class="campo__entrada" type="number" id="itemDuracao" min="5" max="480" step="5"
                                inputmode="numeric" aria-describedby="itemDuracao-erro">
                            <span class="campo__erro" id="itemDuracao-erro" aria-live="polite"></span>
                        </div>
                    </div>
                </div>

                <div class="modal__rodape">
                    <button class="botao botao--secundario" type="button" data-fechar-modal>Cancelar</button>
                    <button class="botao botao--primario" type="submit">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/classificacao.js"></script>
    <script src="js/validacao.js"></script>
    <script src="js/barbearia.js"></script>
</body>

</html>
